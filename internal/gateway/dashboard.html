<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Router Dashboard</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#1d1f24;--muted:#6a6f7a;--line:#e3e4e8;--accent:#3b5bdb;
--ok:#2f7d4f;--ok-bg:#e7f4ec;--bad:#b8412c;--bad-bg:#fbeae6;--mid:#9a6a00;--mid-bg:#fbf1d9;
--c0:#3b5bdb;--c1:#5fa8d3;--c2:#7bc67e;--c3:#e9c46a;--c4:#e07a5f;--c5:#9d7bd8;--c6:#c65f8a;--c7:#6a6f7a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121317;--surface:#1a1c21;--ink:#e6e7ea;--muted:#9aa0ab;--line:#2c2f36;--accent:#8ea2ff;
--ok:#7fd3a0;--ok-bg:#1b3326;--bad:#f09a86;--bad-bg:#3a211b;--mid:#e9c46a;--mid-bg:#3a3017;
--c0:#8ea2ff;--c1:#7fc4ec;--c2:#8fdb92;--c3:#f0d585;--c4:#f0997e;--c5:#b79cf0;--c6:#e08cb0;--c7:#9aa0ab}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1400px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:16px;margin:32px 0 10px}
.sub{color:var(--muted);margin:0 0 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.days{display:flex;gap:6px;margin-left:auto}
.days button{font:inherit;font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:flex;align-items:center;gap:8px;font-size:12px}
.barrow .lbl{width:150px;flex:0 0 auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:5px;height:16px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:4px 0 0 4px}
.barrow .n{width:56px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-right:3px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.axis text{fill:var(--muted);font-size:10px}
.stackbar rect{stroke:var(--surface);stroke-width:1}
.ok-text{color:var(--ok)}.bad-text{color:var(--bad)}
.section-note{color:var(--muted);font-size:12px;margin:-4px 0 10px}
</style></head><body><main>
<h1>Router Dashboard</h1>
<div class="sub"><span id="range-label">last 7 days</span>
<div class="days" id="days">
<button data-d="1">1d</button><button data-d="7" class="on">7d</button><button data-d="30">30d</button><button data-d="0">All</button>
</div></div>

<div id="app">loading…</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const fmtUsd = v => '$' + (v||0).toFixed(4);
const fmtUsd2 = v => '$' + (v||0).toFixed(2);
const fmtPct = v => (v||0).toFixed(0) + '%';
const short = m => { const i = (m||'').lastIndexOf('/'); return i>=0 ? m.slice(i+1) : (m||'—'); };
const colors = ['c0','c1','c2','c3','c4','c5','c6','c7'];
const colorFor = (() => { const m = new Map(); let n = 0;
  return name => { if(!m.has(name)) m.set(name, colors[n++ % colors.length]); return 'var(--'+m.get(name)+')'; }; })();

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in attrs||{}) e.setAttribute(k, attrs[k]);
  for (const c of children||[]) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

function kpis(s) {
  const t = s.totals || {};
  const sav = s.savings || {};
  const floorPct = t.routed ? 100 * (s.reasons && s.reasons['no model cleared the floor'] || 0) / t.routed : 0;
  const c = s.checks || {};
  const checkPct = c.count ? 100 * (c.escalations || 0) / c.count : null;
  const shadowVals = Object.values(s.shadow || {});
  const shadowAgree = shadowVals.length ? shadowVals.reduce((a,x)=>a+x.topic_agree_pct,0)/shadowVals.length : null;
  const items = [
    ['Requests', t.requests || 0],
    ['Spend', fmtUsd2(t.total_cost_usd)],
    ['Savings vs priciest', sav.counterfactual_cost_usd ? fmtUsd2(sav.savings_usd) + ' (' + fmtPct(sav.savings_pct) + ')' : '—'],
    ['Escalated after check', checkPct === null ? '—' : fmtPct(checkPct)],
    ['No model cleared the floor', fmtPct(floorPct)],
    ['Shadow agreement', shadowAgree === null ? '—' : fmtPct(shadowAgree)],
  ];
  const wrap = el('div', {class:'kpis'});
  for (const [l, v] of items) wrap.appendChild(el('div', {class:'kpi'}, [el('div',{class:'v'},[String(v)]), el('div',{class:'l'},[l])]));
  return wrap;
}

function barList(counts, total, fmt) {
  fmt = fmt || (n => String(n));
  const entries = Object.entries(counts||{}).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return el('div', {class:'empty'}, ['No data yet.']);
  const max = Math.max(...entries.map(e=>e[1]), 1);
  const wrap = el('div', {class:'bars'});
  for (const [name, n] of entries) {
    const pct = 100 * n / max;
    wrap.appendChild(el('div', {class:'barrow'}, [
      el('div', {class:'lbl', title:name}, [name]),
      el('div', {class:'track'}, [el('div', {class:'fill', style:`width:${pct}%`})]),
      el('div', {class:'n'}, [fmt(n, total)]),
    ]));
  }
  return wrap;
}

function stackedDaily(daily) {
  if (!daily || !daily.length) return el('div', {class:'empty'}, ['No data yet.']);
  const modelSet = new Set();
  for (const d of daily) for (const m in d.models) modelSet.add(m);
  const models = [...modelSet];
  const totals = daily.map(d => models.reduce((a,m)=> a + (d.models[m]? d.models[m].cost_usd : 0), 0));
  const max = Math.max(...totals, 0.0001);
  const w = 900, h = 260, padL = 50, padB = 24, padT = 10, padR = 10;
  const bw = (w - padL - padR) / daily.length;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', '100%');
  svg.classList.add('stackbar');
  const g = document.createElementNS(svg.namespaceURI, 'g');
  svg.appendChild(g);
  // gridlines + y axis
  for (let i=0;i<=4;i++) {
    const y = padT + (h-padT-padB) * (1 - i/4);
    const line = document.createElementNS(svg.namespaceURI, 'line');
    line.setAttribute('x1', padL); line.setAttribute('x2', w-padR); line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--line)'); line.setAttribute('stroke-width', '1');
    g.appendChild(line);
    const t = document.createElementNS(svg.namespaceURI, 'text');
    t.setAttribute('x', padL-6); t.setAttribute('y', y+3); t.setAttribute('text-anchor','end'); t.setAttribute('class','axis');
    t.textContent = '$' + (max*i/4).toFixed(2);
    g.appendChild(t);
  }
  daily.forEach((d, i) => {
    let y0 = h - padB;
    const x = padL + i*bw + 1;
    for (const m of models) {
      const v = d.models[m] ? d.models[m].cost_usd : 0;
      if (!v) continue;
      const bh = (h-padT-padB) * v / max;
      const rect = document.createElementNS(svg.namespaceURI, 'rect');
      rect.setAttribute('x', x); rect.setAttribute('width', Math.max(bw-2,1));
      rect.setAttribute('y', y0 - bh); rect.setAttribute('height', bh);
      rect.setAttribute('fill', colorFor(m));
      const title = document.createElementNS(svg.namespaceURI, 'title');
      title.textContent = `${d.date} · ${short(m)}: ${fmtUsd(v)}`;
      rect.appendChild(title);
      g.appendChild(rect);
      y0 -= bh;
    }
    if (i % Math.ceil(daily.length/10 || 1) === 0) {
      const t = document.createElementNS(svg.namespaceURI, 'text');
      t.setAttribute('x', x+bw/2); t.setAttribute('y', h-6); t.setAttribute('text-anchor','middle'); t.setAttribute('class','axis');
      t.textContent = d.date.slice(5);
      g.appendChild(t);
    }
  });
  const wrap = el('div', {});
  wrap.appendChild(svg);
  const leg = el('div', {class:'legend'});
  for (const m of models) {
    const dot = el('span', {style:`display:inline-block;width:9px;height:9px;border-radius:2px;background:${colorFor(m)};margin-right:4px`});
    leg.appendChild(dot);
    leg.appendChild(document.createTextNode(short(m) + '  '));
  }
  wrap.appendChild(leg);
  return wrap;
}

function modelTable(models) {
  const entries = Object.entries(models||{}).sort((a,b)=>b[1].cost_usd-a[1].cost_usd);
  if (!entries.length) return el('div', {class:'empty'}, ['No data yet.']);
  const table = el('table', {}, [el('tr', {}, [
    el('th',{},['Model']), el('th',{class:'num'},['Requests']), el('th',{class:'num'},['Cost']),
    el('th',{class:'num'},['Prompt tok']), el('th',{class:'num'},['Compl tok']),
    el('th',{class:'num'},['Avg ms']), el('th',{class:'num'},['p50 ms']), el('th',{class:'num'},['p95 ms']),
    el('th',{class:'num'},['Errors']),
  ])]);
  for (const [id, m] of entries) {
    table.appendChild(el('tr', {}, [
      el('td',{title:id},[short(id)]),
      el('td',{class:'num'},[String(m.requests)]),
      el('td',{class:'num'},[fmtUsd(m.cost_usd)]),
      el('td',{class:'num'},[String(m.prompt_tokens)]),
      el('td',{class:'num'},[String(m.completion_tokens)]),
      el('td',{class:'num'},[m.avg_latency_ms.toFixed(0)]),
      el('td',{class:'num'},[String(m.p50_latency_ms)]),
      el('td',{class:'num'},[String(m.p95_latency_ms)]),
      el('td',{class:'num'},[String(m.errors)]),
    ]));
  }
  return el('div', {class:'card'}, [table]);
}

function shadowSection(shadow) {
  const entries = Object.entries(shadow||{});
  if (!entries.length) return el('div', {class:'empty'}, ['Shadow mode is off, or no data yet.']);
  const table = el('table', {}, [el('tr', {}, [
    el('th',{},['Provider']), el('th',{class:'num'},['Count']), el('th',{class:'num'},['Topic agree']),
    el('th',{class:'num'},['Complexity agree']), el('th',{class:'num'},['Errors']),
  ])]);
  for (const [p, v] of entries) {
    table.appendChild(el('tr', {}, [
      el('td',{},[p]), el('td',{class:'num'},[String(v.count)]),
      el('td',{class:'num'},[fmtPct(v.topic_agree_pct)]), el('td',{class:'num'},[fmtPct(v.complexity_agree_pct)]),
      el('td',{class:'num'},[String(v.errors)]),
    ]));
  }
  return el('div', {class:'card'}, [table]);
}

function checksSection(c) {
  c = c || {};
  if (!c.count) return el('div', {class:'empty'}, ['No check events yet.']);
  const wrap = el('div', {class:'card'});
  wrap.appendChild(el('p', {}, [`${c.count} checks · ${fmtPct(c.pass_rate_pct)} pass rate · ${c.escalations} escalated after check · ${c.errors || 0} check errors · ${fmtUsd(c.cost_usd)} check cost`]));
  if (c.escalations) wrap.appendChild(barList(c.escalation_pairs, c.escalations));
  return wrap;
}

function feedbackSection(f) {
  f = f || {};
  const total = (f.good||0) + (f.bad||0);
  if (!total) return el('div', {class:'empty'}, ['No feedback yet.']);
  const wrap = el('div', {class:'card'});
  wrap.appendChild(el('p', {}, [el('span',{class:'ok-text'},[`${f.good} good`]), ' / ', el('span',{class:'bad-text'},[`${f.bad} bad`])]));
  const entries = Object.entries(f.per_model||{}).filter(([,v])=>v.good||v.bad);
  if (entries.length) {
    const table = el('table', {}, [el('tr', {}, [el('th',{},['Model']), el('th',{class:'num'},['Good']), el('th',{class:'num'},['Bad'])])]);
    for (const [m, v] of entries) table.appendChild(el('tr', {}, [el('td',{},[short(m)]), el('td',{class:'num'},[String(v.good)]), el('td',{class:'num'},[String(v.bad)])]));
    wrap.appendChild(table);
  }
  return wrap;
}

function render(s) {
  app.innerHTML = '';
  app.appendChild(kpis(s));

  app.appendChild(el('h2', {}, ['Daily cost per model']));
  app.appendChild(el('div', {class:'card'}, [stackedDaily(s.daily)]));

  app.appendChild(el('h2', {}, ['Models']));
  app.appendChild(modelTable(s.models));

  app.appendChild(el('div', {class:'grid2'}, [
    el('div', {}, [el('h2', {}, ['Routing reasons']), el('div', {class:'card'}, [barList(s.reasons, s.totals && s.totals.routed)])]),
    el('div', {}, [el('h2', {}, ['Topics']), el('div', {class:'card'}, [barList(s.topics)])]),
  ]));

  app.appendChild(el('div', {class:'grid2'}, [
    el('div', {}, [el('h2', {}, ['Complexity (0–3)']), el('div', {class:'card'}, [barList({0:s.complexity[0],1:s.complexity[1],2:s.complexity[2],3:s.complexity[3]})])]),
    el('div', {}, [el('h2', {}, ['Risk (0–2)']), el('div', {class:'card'}, [barList({0:s.risk[0],1:s.risk[1],2:s.risk[2]})])]),
  ]));

  app.appendChild(el('h2', {}, ['Shadow agreement']));
  app.appendChild(shadowSection(s.shadow));

  app.appendChild(el('h2', {}, ['Checks']));
  app.appendChild(checksSection(s.checks));

  app.appendChild(el('h2', {}, ['Feedback']));
  app.appendChild(feedbackSection(s.feedback));

  const rt = s.retries || {};
  app.appendChild(el('h2', {}, ['Retries']));
  const rw = el('div', {class:'card'});
  rw.appendChild(el('p', {class:'section-note'}, [`${rt.requests||0} requests needed a retry`]));
  rw.appendChild(barList(rt.per_model));
  app.appendChild(rw);
}

let current = 7;
async function load(days) {
  current = days;
  document.querySelectorAll('#days button').forEach(b => b.classList.toggle('on', Number(b.dataset.d) === days));
  $('#range-label').textContent = days === 0 ? 'all time' : `last ${days} day${days===1?'':'s'}`;
  app.textContent = 'loading…';
  try {
    const res = await fetch('/stats?days=' + days);
    const s = await res.json();
    render(s);
  } catch (e) {
    app.textContent = 'Failed to load stats: ' + e;
  }
}

$('#days').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  load(Number(b.dataset.d));
});

load(7);
</script>
</main></body></html>
